<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: black; color: white;">
    <ul class="language">
        <li>Java Script</li>
    </ul>
</body>
<script>
    // Method 1 to add new element to the list .
    function addlang(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addlang('Python'); 

    // Method 2 to add new element to the list it's more efficient .
    function addOptiLang(langName){
        const li = document.createElement('li')
        const addText = document.createTextNode(langName)
        li.appendChild(addText)
        document.querySelector('.language').appendChild(li)
    }
    addOptiLang('c++');

    // Editing existing element . 
    // const secondLang= document.querySelector("li:nth-child(2)")
    // secondLang.innerHTML = "Java"

    // Another way to edit existing element .
    const secondLang= document.querySelector("li:nth-child(2)")
    const newLi = document.createElement('Li')
    newLi.textContent = "java"
    secondLang.replaceWith(newLi);

    // Deleting existing element .
    const lastLang = document.querySelector("li:nth-child(3)")
    lastLang.remove();



</script>
</html>
