    // Bubbling and capturing
    // By default event bubbling is there.
    // Capturing is rarely used by changing the third parameter to true.
    // In bubbling the event is first captured and handled by the innermost element and then propagated to outer elements.
    // In capturing the event is first captured by the outermost element and propagated to the inner elements.

    // To prevent UL from being removed by remove fuction we added if condition to make sure the  target is IMG not UL.
    document.querySelector('#images').addEventListener('click', function(e){
        console.log(e.target.tagName);
        if (e.target.tagName === 'IMG') {
            console.log(e.target.id);
            let removeIt = e.target.parentNode
            removeIt.remove()
        }
    
        
    })
